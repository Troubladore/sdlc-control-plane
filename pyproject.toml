[project]
name = "sdlc-control-plane"
version = "0.1.0"
description = "Engineering Control Plane -- reusable SDLC governance with Camunda orchestration, certificate-driven development, and competitive multi-model review"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Troubladore" },
]
keywords = ["sdlc", "camunda", "bpmn", "certificate", "governance", "code-review"]

dependencies = [
    "pydantic>=2.0",
    "jsonschema>=4.20",
    "rich>=13.0",
    "click>=8.1",
]

[project.optional-dependencies]
camunda = [
    "pyzeebe>=4.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.90",
    "mypy>=1.8",
    "ruff>=0.3",
]

[project.scripts]
sdlc = "sdlc_control_plane.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sdlc_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]
